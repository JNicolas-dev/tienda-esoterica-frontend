<div class="container-fluid py-4">

  <h1 class="text-warning mb-5">

    👑 Panel Administrador

  </h1>

  <div class="row">

    <!-- FORMULARIO -->

    <div class="col-lg-4 mb-4">

      <div class="card bg-dark border-0 shadow-lg p-4">

        <h3 class="text-warning mb-4">

          Crear Producto

        </h3>

        <div class="mb-3">

          <label class="text-light mb-2">

            Nombre

          </label>

          <input
            type="text"
            class="form-control"
            [(ngModel)]="producto.nombre"
          >

        </div>

        <div class="mb-3">

          <label class="text-light mb-2">

            Descripción

          </label>

          <textarea
            class="form-control"
            rows="4"
            [(ngModel)]="producto.descripcion"
          ></textarea>

        </div>

        <div class="mb-3">

          <label class="text-light mb-2">

            Precio

          </label>

          <input
            type="number"
            class="form-control"
            [(ngModel)]="producto.precio"
          >

        </div>

        <div class="mb-3">

          <label class="text-light mb-2">

            Categoría

          </label>

          <input
            type="text"
            class="form-control"
            [(ngModel)]="producto.categoria"
          >

        </div>

        <div class="mb-4">

          <label class="text-light mb-2">

            Imagen URL

          </label>

          <input
            type="text"
            class="form-control"
            [(ngModel)]="producto.imagen"
          >

        </div>

        <!-- PREVIEW -->

        <div
          *ngIf="producto.imagen"
          class="mb-4 text-center"
        >

          <img
            [src]="producto.imagen"
            class="img-fluid rounded shadow"
            style="max-height: 220px;"
          >

        </div>

        <button
  *ngIf="!modoEdicion"
  class="btn btn-warning w-100"
  (click)="crearProducto()"
>
  Crear Producto
</button>

<button
  *ngIf="modoEdicion"
  class="btn btn-success w-100"
  (click)="actualizarProducto()"
>
  Actualizar Producto
</button>

<button
  *ngIf="modoEdicion"
  class="btn btn-secondary w-100 mt-2"
  (click)="cancelarEdicion()"
>
  Cancelar
</button>

      </div>

    </div>

    <!-- PRODUCTOS -->

    <div class="col-12 col-lg-8">

      <div class="row">

        <div
          class="col-12 col-lg-4"
          *ngFor="let p of productos"
        >

          <div class="card bg-dark text-light border-0 shadow-lg h-100">

            <img
              [src]="p.imagen"
              class="card-img-top"
              style="height: 250px; object-fit: cover;"
            >

            <div class="card-body d-flex flex-column">

              <h4 class="text-warning">

                {{ p.nombre }}

              </h4>

              <p class="small flex-grow-1">

                {{ p.descripcion }}

              </p>

              <h5 class="text-success">

                $ {{ p.precio }}

              </h5>

              <span class="badge bg-warning text-dark mb-3">

                {{ p.categoria }}

              </span>

              <button
                class="btn btn-danger w-100"
                (click)="eliminarProducto(p.id)"
              >
                🗑 Eliminar
              </button>
              <button
  class="btn btn-primary w-100"
  (click)="editarProducto(p)"
>
  Editar
</button>

            </div>

          </div>

        </div>

      </div>

    </div>

  </div>

</div>
