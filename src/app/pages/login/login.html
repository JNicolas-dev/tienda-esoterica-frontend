<h2>Login / Registro</h2>

<input class="form-control mb-2" [(ngModel)]="nombre" placeholder="Nombre">
<input class="form-control mb-2" [(ngModel)]="email" placeholder="Email">
<input class="form-control mb-2" [(ngModel)]="password" type="password" placeholder="Password">

<button class="btn btn-primary me-2" (click)="login()">Login</button>
<button class="btn btn-secondary" (click)="register()">Registro</button>
