<div class="container mt-5">

  <h2>Login</h2>

  <form (ngSubmit)="login()">

    <div class="mb-3">

      <input
        type="email"
        class="form-control"
        placeholder="Correo"
        [(ngModel)]="email"
        name="email"
      >

    </div>

    <div class="mb-3">

      <input
        type="password"
        class="form-control"
        placeholder="Contraseña"
        [(ngModel)]="password"
        name="password"
      >

    </div>

    <button
      class="btn btn-primary"
      type="submit"
    >
      Ingresar
    </button>

  </form>

  <p class="mt-3">
    {{ mensaje }}
  </p>

</div>
