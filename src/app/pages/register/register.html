<div class="container mt-5" style="max-width:500px;">

  <div class="card p-4">

    <h2 class="mb-4 text-center">
      Registro
    </h2>

    <input
      type="text"
      class="form-control mb-3"
      placeholder="Nombre"
      [(ngModel)]="form.nombre"
    >

    <input
      type="email"
      class="form-control mb-3"
      placeholder="Correo"
      [(ngModel)]="form.email"
    >

    <input
      type="password"
      class="form-control mb-3"
      placeholder="Contraseña"
      [(ngModel)]="form.password"
    >

    <button
      class="btn btn-dark w-100"
      (click)="registrar()"
    >
      Registrarse
    </button>

  </div>

</div>
